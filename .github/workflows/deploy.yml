---
name: deploy
on:
  push:
    branches: [main]
  # Pull requests run the build and every check; only main deploys.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Install MkDocs NG and Sumi (pinned in requirements.txt)
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --strict

      - name: Internal links, anchors, inbound-URL contract, external-request budget
        run: python3 scripts/check_site.py site

      - name: HTML validation
        run: |
          pipx install html5validator==0.4.2
          html5validator --root site/ --also-check-svg --log INFO

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  # Only this job can publish to Pages; the build job, which runs scripts and
  # third-party tools (mkdocs, html5validator), has a read-only token.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
